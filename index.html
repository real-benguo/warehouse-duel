<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>仓库单挑 · Warehouse Duel</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./favicon.svg">
<link rel="stylesheet" href="./css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js"
  }
}
</script>
</head>
<body>

<canvas id="gl"></canvas>

<!-- ================= 加载 ================= -->
<div id="scr-load" class="screen show">
  <div class="loadbox">
    <div class="logo">仓库单挑</div>
    <div class="sub">WAREHOUSE DUEL</div>
    <div class="bar"><i id="load-bar"></i></div>
    <div class="loadtxt" id="load-txt">正在装载资源…</div>
  </div>
</div>

<!-- ================= 选端 ================= -->
<div id="scr-pick" class="screen">
  <div class="pickbox">
    <div class="logo small">选择你的设备</div>
    <div class="sub">两边的操作方式完全不同，选错了会玩不下去</div>
    <div class="pickrow">
      <button class="pick" data-mode="desktop">
        <div class="pico">🖥️</div>
        <div class="ptitle">电脑端</div>
        <div class="pdesc">WASD 移动 · 鼠标转视角<br>左键开火 · 右键开镜<br>数字键 1-6 换枪</div>
        <div class="ptag" id="tag-desktop"></div>
      </button>
      <button class="pick" data-mode="mobile">
        <div class="pico">📱</div>
        <div class="ptitle">手机端</div>
        <div class="pdesc">左半屏摇杆移动<br>右半屏拖动转视角<br>右下角按钮开火/开镜/换弹</div>
        <div class="ptag" id="tag-mobile"></div>
      </button>
    </div>
    <div class="hint">提示：横屏玩体验最好。选完之后在设置里还能改。</div>
  </div>
</div>

<!-- ================= 主菜单 ================= -->
<div id="scr-menu" class="screen">
  <div class="menubox">
    <div class="logo">仓库单挑</div>
    <div class="sub">第一人称 · 六把枪 · 先到 5 分</div>
    <div class="menu" id="menu-list">
      <button class="mi" data-act="play">开 始 对 战</button>
      <button class="mi" data-act="arsenal">武 器 库</button>
      <button class="mi" data-act="help">操 作 说 明</button>
      <button class="mi" data-act="quality">画 质：<span id="q-label">自动</span></button>
      <button class="mi" data-act="switch">切 换 设 备 端（当前：<span id="m-label">电脑端</span>）</button>
    </div>
    <div class="hint" id="menu-hint">对手：AI 机器人</div>
  </div>
</div>

<!-- ================= 武器库 ================= -->
<div id="scr-arsenal" class="screen">
  <div class="panelbox">
    <div class="ptitle2">武 器 库</div>
    <div class="arsenal" id="arsenal-list"></div>
    <button class="back" data-back="menu">返 回</button>
  </div>
</div>

<!-- ================= 操作说明 ================= -->
<div id="scr-help" class="screen">
  <div class="panelbox">
    <div class="ptitle2">操 作 说 明</div>
    <div class="helpgrid" id="help-body"></div>
    <button class="back" data-back="menu">返 回</button>
  </div>
</div>

<!-- ================= 暂停 ================= -->
<div id="scr-pause" class="screen">
  <div class="panelbox narrow">
    <div class="ptitle2">暂 停</div>
    <div class="menu">
      <button class="mi" data-act="resume">继 续</button>
      <button class="mi" data-act="restart">重 开 一 局</button>
      <button class="mi" data-act="quit">回 到 主 菜 单</button>
    </div>
  </div>
</div>

<!-- ================= 结算 ================= -->
<div id="scr-over" class="screen">
  <div class="panelbox narrow">
    <div class="bigres" id="over-title">胜 利</div>
    <div class="sub" id="over-sub"></div>
    <div class="menu">
      <button class="mi" data-act="restart">再 来 一 局</button>
      <button class="mi" data-act="quit">回 到 主 菜 单</button>
    </div>
  </div>
</div>

<!-- ================= HUD ================= -->
<div id="hud" class="hidden">
  <div id="crosshair">
    <i class="ch t"></i><i class="ch b"></i><i class="ch l"></i><i class="ch r"></i>
    <i class="ch dot"></i>
  </div>
  <div id="hitmark"><i></i><i></i><i></i><i></i></div>
  <div id="scope-overlay"></div>

  <div id="hud-top">
    <div class="score-side">
      <div class="sname">你</div>
      <div class="sdots" id="dots-me"></div>
    </div>
    <div class="roundinfo">
      <div id="round-state">回合 1</div>
      <div id="round-timer">--</div>
    </div>
    <div class="score-side right">
      <div class="sname">AI</div>
      <div class="sdots" id="dots-ai"></div>
    </div>
  </div>

  <div id="banner"></div>
  <div id="feed"></div>

  <div id="hud-bot">
    <div class="hpwrap">
      <div class="hplabel">HP</div>
      <div class="hpbar"><i id="hp-fill"></i></div>
      <div class="hpnum" id="hp-num">100</div>
    </div>
    <div class="wpnwrap">
      <div class="wpnname" id="wpn-name">—</div>
      <div class="ammo"><span id="ammo-mag">0</span><span class="sep">/</span><span id="ammo-res">∞</span></div>
      <div class="reloadbar"><i id="reload-fill"></i></div>
    </div>
  </div>

  <div id="dmgdir"></div>
  <div id="lowhp"></div>
</div>

<!-- ================= 触屏控制 ================= -->
<div id="touch" class="hidden">
  <div id="stick-zone"><div id="stick-base"><div id="stick-knob"></div></div></div>
  <div id="btn-fire" class="tbtn big">开火</div>
  <div id="btn-ads" class="tbtn">开镜</div>
  <div id="btn-reload" class="tbtn">换弹</div>
  <div id="btn-jump" class="tbtn">跳</div>
  <div id="btn-swap" class="tbtn">换枪</div>
  <div id="wpn-wheel"></div>
  <div id="btn-pause" class="tbtn tiny">II</div>
</div>

<div id="rotate-warn">
  <div>请把手机横过来 🔄</div>
</div>

<div id="fatal"></div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
